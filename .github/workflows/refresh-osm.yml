# 서울 길 지도(data/ways)를 OpenStreetMap에서 한 달에 한 번 새로 만든다.
# Actions 탭에서 "Run workflow"로 바로 돌릴 수도 있다.
# 일부 칸을 못 받으면 받은 칸만 올리고 실행 결과를 실패로 표시한다(못 받은 칸은 이전 파일 그대로).
name: 서울 길 지도 갱신

on:
  schedule:
    - cron: '17 18 1 * *'   # 매달 2일 03:17 (한국 시각)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-osm
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 길 격자 파일 만들기
        run: node tools/build-ways.js
      - name: 바뀐 파일 올리기
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then echo "바뀐 길 정보가 없어요"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ways data/seoul.js
          git commit -m "서울 길 지도 갱신 (OpenStreetMap)"
          git pull --rebase
          git push
      - name: 사이트 다시 만들기
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 다시 만들기 요청을 못 했어요(다음 업로드 때 반영돼요)"
